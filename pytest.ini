[pytest]
testpaths = tests
python_files = test_*.py
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore::DeprecationWarning:torch.jit._serialization
    ignore::PendingDeprecationWarning:starlette.formparsers
markers =
    e2e: end-to-end tests requiring a real browser + server (run via `pytest tests/e2e`)
addopts =
    -m "not e2e"
