<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#3B82F6" />
    <meta name="description" content="Arena - Fully offline AI assistant powered by local LLMs" />
    <link rel="manifest" href="/manifest.json" />
    <title>Arena - Local AI Assistant</title>
    <style>
      /* Show loading indicator before React mounts */
      #root:empty {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background: #0F172A;
        color: #F1F5F9;
        font-family: Inter, system-ui, sans-serif;
      }
      #root:empty::after {
        content: 'Loading Arena...';
        font-size: 1.2rem;
        animation: pulse 1.5s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 1; }
      }
    </style>
    <script>
      // Apply theme immediately before React loads to prevent flash of unstyled content
      (function() {
        try {
          const stored = localStorage.getItem('arena-appearance-settings');
          if (stored) {
            const settings = JSON.parse(stored);
            const theme = settings.state?.theme || 'dark';
            if (theme === 'light') {
              document.documentElement.classList.add('light');
              document.documentElement.setAttribute('data-theme', 'light');
            } else {
              document.documentElement.classList.add('dark');
              document.documentElement.setAttribute('data-theme', 'dark');
            }
          } else {
            // Default to dark theme
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) {
          // Fallback to dark theme on error
          document.documentElement.classList.add('dark');
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
